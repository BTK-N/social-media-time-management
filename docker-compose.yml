version: '3.8'

services:
  backend:
    build:
      context: ./social-media
    ports:
      - "8000:8000"
    # Ensure env file is loaded if it exists
    env_file:
      - ./social-media/k.env
    environment:
      # Fallback in case k.env is missing or doesn't have it
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./rooted-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
